plugins {
    id 'com.android.application'
}

android {
    namespace 'cj.instawall.plus'
    compileSdk 35

    defaultConfig {
        applicationId "cj.instawall.plus"
        minSdk 30
        targetSdk 34
        // CI passes -PversionCode=<n> so every release can be installed over the previous one
        versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 33
        versionName project.hasProperty('versionCode') ? project.versionCode : "33"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // set by the release workflow from repository secrets
            def keystore = System.getenv("RELEASE_KEYSTORE_PATH")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("RELEASE_KEYSTORE_PATH")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // same key as releases (when available) so debug builds and releases install over each other
            if (System.getenv("RELEASE_KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        // android.util.Log in app classes under JVM tests
        unitTests.returnDefaultValues = true
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    // android's org.json is a stub in local unit tests
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}